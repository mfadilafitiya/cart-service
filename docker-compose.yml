version: '3.8'

services:
  product-services:
    build: 
      context: ./product-service
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=product-db
      - DB_USER=appuser
      - DB_PASSWORD=apppassword
      - DB_NAME=productdb
    depends_on:
      product-db:
        condition: service_healthy

  product-db:
    image: mysql:8.0
    environment:
      - MYSQL_DATABASE=productdb
      - MYSQL_USER=appuser
      - MYSQL_PASSWORD=apppassword
      - MYSQL_ROOT_PASSWORD=rootpassword
    volumes:
      - product-db-data:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost","--user=root","--password=rootpassword"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 5s

  cart-service:
    build:
      context: ./cart-service
      dockerfile: Dockerfile
    ports:
      - "3001:3002"
    environment:
      - DB_HOST=cart-db
      - DB_USER=postgres
      - DB_PASSWORD=Dev@root23
      - DB_NAME=cartdb
      - APP_ENV=docker
    depends_on:
      - cart-db
    healthcheck:
      test: ["CMD", "pg_isready", "--host=cart-db", "--username=postgres", "--dbname=cartdb"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 5s
    command: bash -c "php artisan migrate && php -S 0.0.0.0:3002 -t public"

  cart-db:
    image: postgres:13
    environment:
      POSTGRES_USER: postgres  
      POSTGRES_PASSWORD: Dev@root23
      POSTGRES_DB: cartdb
    volumes:
      - cart-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "--host=localhost", "--username=postgres", "--dbname=cartdb"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 5s

  review-service:
    build:
      context: ./review-service
      dockerfile: Dockerfile
    ports:
      - "3002:3002"
    environment:
      - HOST=0.0.0.0
      - PORT=3002
      - FLASK_DEBUG=1
      - MONGO_URI=mongodb://appuser:apppassword@review-db:27017/?authSource=admin
      - MONGO_DB_NAME=reviewdb
      - PRODUCT_SERVICE_URL=http://product-services:3000
    depends_on:
      review-db:
        condition: service_healthy

  review-db:
    image: mongo:6.0
    environment:
      - MONGO_INITDB_ROOT_USERNAME=appuser
      - MONGO_INITDB_ROOT_PASSWORD=apppassword
    ports:
      - "27017:27017"
    volumes:
      - review-db-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      retries: 5
      start_period: 20s
      timeout: 5s

volumes:
  product-db-data:
  cart-db-data:
  review-db-data: